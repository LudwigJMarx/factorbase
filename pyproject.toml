[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factorbase"
version = "0.1.0"
description = "A catalogue of stock-screening factors: technical indicators, fundamental ratios and chart signals, each with a stated formula and a reference implementation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ludwig J. Marx" }]
keywords = ["technical-analysis", "indicators", "screening", "backtesting", "factors"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/LudwigJMarx/factorbase"
Source = "https://github.com/LudwigJMarx/factorbase"

[project.scripts]
factorbase = "factorbase.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/factorbase"]

[tool.hatch.build.targets.wheel.force-include]
"catalog" = "factorbase/catalog"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/factorbase"]
