[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factorbase"
version = "0.1.0"
description = "A catalogue of stock-screening factors: technical indicators, fundamental ratios and chart signals, each with a stated formula and a reference implementation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ludwig J. Marx" }]
keywords = ["technical-analysis", "indicators", "screening", "backtesting", "factors"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5", "pandas-stubs>=2.1", "types-PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/LudwigJMarx/factorbase"
Source = "https://github.com/LudwigJMarx/factorbase"

[project.scripts]
factorbase = "factorbase.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/factorbase"]

[tool.hatch.build.targets.wheel.force-include]
"catalog" = "factorbase/catalog"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# No python_version pin. Pinning it to the floor while running on a newer
# interpreter makes mypy read that interpreter's stubs under the old rules, and
# numpy's own stubs then fail to parse. The floor is enforced by the CI matrix,
# which runs the whole suite on every supported version.
strict = true
files = ["src/factorbase"]

[[tool.mypy.overrides]]
# pandas-stubs types most arithmetic on a Series as Any, so strict mode reports
# every `return series * 100.0` as returning Any from a function declared to
# return a Series. The fix would be a cast on almost every line of the factor
# modules, which buys no safety and costs the readability the formulas depend
# on. Everything else stays strict, including this package's own boundaries.
module = ["factorbase.factors.*", "factorbase.registry"]
warn_return_any = false
