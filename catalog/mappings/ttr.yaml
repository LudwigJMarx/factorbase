# How this catalogue relates to TTR, the R package that computes much of the
# same set.
#
# ── WHY THIS FILE EXISTS ───────────────────────────────────────────────────
#
# The README claims that two packages will both hand you "RSI(14)" and disagree,
# because one smoothed with Wilder's 1/n and the other with a 2/(n+1) average,
# and neither wrote it down. That was an argument. This file makes it a
# measurement, against a package a great many people already have installed.
#
# ── WHAT A READER GETS OUT OF IT ───────────────────────────────────────────
#
# For every factor listed: the exact R call that agrees with this catalogue, and
# the call a reader would reach for first when it is not the same one. The second
# is the useful half. Four of the entries below have a trap, and each trap is a
# default argument nobody thinks about.
#
# ── THE RULE THIS FILE LIVES UNDER ─────────────────────────────────────────
#
# Every number here was produced by running both sides. A mapping table nobody
# runs is an unverified assertion in a project whose whole premise is
# verification, so `scripts/check_against_ttr.py` is a gate in CI and this file
# does not ship without it. The traps are checked too, in the other direction:
# if a difference this file calls out ever disappears, the check fails, because
# the note would then be describing something that no longer happens.

version: 1
package: TTR
measured_against: "0.24.4"
measured_on: "R 4.6.1"
series: tests/data/reference_series.csv

mappings:
  # ── Agreeing outright ────────────────────────────────────────────────────
  - factor: sma
    arguments: {periods: 20}
    call: 'SMA(close, 20)'
    column: sma
    agreement: identical
    tolerance: 1.0e-9

  - factor: ema
    arguments: {periods: 20}
    call: 'EMA(close, 20)'
    column: ema
    agreement: identical
    tolerance: 1.0e-9
    note: >-
      Both seed with the simple mean of the first n values. TTR's `wilder = TRUE`
      is a different constant, not a different seed, and is what its Wilder-based
      indicators use internally.

  - factor: wma
    arguments: {periods: 20}
    call: 'WMA(close, 20)'
    column: wma
    agreement: identical
    tolerance: 1.0e-9

  - factor: rsi
    call: 'RSI(close, 14)'
    column: rsi
    agreement: identical
    tolerance: 1.0e-9
    note: >-
      TTR's default is Wilder's smoothing, the same as this catalogue's. Worth
      stating because the opposite is widely assumed, including by the author of
      this file before it was run.
    trap:
      call: 'RSI(close, 14, maType = "EMA")'
      column: trap_rsi_ema
      measured_difference: 17.51
      note: >-
        Asking for an exponential average gets the 2/(n+1) constant and a reading
        up to 17 points away from Wilder's. This is the disagreement the README
        describes, in the one package most likely to be the second opinion.

  - factor: rate_of_change
    call: 'ROC(close, 12, type = "discrete") * 100'
    column: rate_of_change
    agreement: identical
    tolerance: 1.0e-9
    note: >-
      TTR's default is `type = "continuous"`, which is the log return and a
      different quantity.

  - factor: cci
    call: 'CCI(cbind(high, low, close), 20, c = 0.015)'
    column: cci
    agreement: identical
    tolerance: 1.0e-8
    note: Both take the mean absolute deviation, not the standard deviation.

  - factor: close_location_value
    call: 'CLV(cbind(high, low, close))'
    column: close_location_value
    agreement: identical
    tolerance: 1.0e-12

  - factor: accumulation_distribution_line
    call: 'chaikinAD(cbind(high, low, close), volume)'
    column: accumulation_distribution_line
    agreement: identical
    tolerance: 1.0e-6
    note: >-
      A running sum over 500 bars of values around 1e6, so the tolerance is
      floating-point accumulation and not a difference of method.

  - factor: money_flow_index
    call: 'MFI(cbind(high, low, close), volume, 14)'
    column: money_flow_index
    agreement: identical
    tolerance: 1.0e-9

  - factor: williams_percent_r
    call: 'WPR(cbind(high, low, close), 14) * -100'
    column: williams_percent_r
    agreement: identical
    tolerance: 1.0e-9
    note: TTR returns it on a 0 to 1 scale; this catalogue uses the original 0 to -100.

  - factor: stochastic_fast_k
    call: 'stoch(cbind(high, low, close), 14, 3, 3, smooth = 1)[, "fastK"] * 100'
    column: stochastic_fast_k
    agreement: identical
    tolerance: 1.0e-9

  - factor: stochastic_fast_d
    call: 'stoch(cbind(high, low, close), 14, 3, 3, smooth = 1)[, "fastD"] * 100'
    column: stochastic_fast_d
    agreement: identical
    tolerance: 1.0e-9

  - factor: stochastic_slow_d
    call: 'stoch(cbind(high, low, close), 14, 3, 3, smooth = 1)[, "slowD"] * 100'
    column: stochastic_slow_d
    agreement: identical
    tolerance: 1.0e-9

  - factor: macd
    call: 'MACD(close, 12, 26, 9, maType = "EMA", percent = FALSE)[, "macd"]'
    column: macd
    agreement: identical
    tolerance: 1.0e-9
    trap:
      call: 'MACD(close, 12, 26, 9, maType = "EMA")'
      column: trap_macd_percent
      measured_difference: 0.77
      note: >-
        TTR's `percent` defaults to TRUE, which divides the difference by the
        slow average. That is a ratio and this catalogue's entry is in currency,
        so the two are not comparable at all rather than merely different.

  - factor: bollinger_percent_b
    call: 'BBands(close, n = 20, sd = 2)[, "pctB"]'
    column: bollinger_percent_b
    agreement: identical
    tolerance: 1.0e-9
    note: >-
      Both use the population deviation. TTR's `runSD(sample = FALSE)` is what
      BBands calls; `sample = TRUE` is its own default elsewhere and would widen
      the bands.
    trap:
      call: 'BBands(cbind(high, low, close), n = 20, sd = 2)[, "pctB"]'
      column: trap_bollinger_percent_b_hlc
      measured_difference: 0.31
      note: >-
        Handed a high-low-close matrix, which is how every other TTR function in
        this file is called, BBands computes the bands on the typical price
        rather than on the close. Nothing in the call says so.

  - factor: aroon_up
    arguments: {periods: 25}
    call: 'aroon(cbind(high, low), 24)[, "aroonUp"]'
    column: aroon_up
    agreement: identical
    tolerance: 1.0e-9
    note: >-
      TTR's n counts the lookback interval where this catalogue's counts the
      window, so the same measurement is TTR's n plus one. Both then divide by
      that n.
    trap:
      call: 'aroon(cbind(high, low), 25)[, "aroonUp"]'
      column: trap_aroon_up_same_n
      measured_difference: 100.0
      note: >-
        Passing the same number to both is the obvious thing to do, and the two
        then measure over windows one bar apart. The median difference is 1
        point, which looks like rounding, and the maximum is the whole scale:
        where the older window still holds the high and the newer one has just
        lost it, one reads 100 and the other 0. That happens on 1.3 percent of
        bars on the reference series, which is often enough to matter and rare
        enough to go unnoticed.

  - factor: aroon_down
    arguments: {periods: 25}
    call: 'aroon(cbind(high, low), 24)[, "aroonDn"]'
    column: aroon_down
    agreement: identical
    tolerance: 1.0e-9

  # ── Agreeing once the seed has decayed ───────────────────────────────────
  - factor: true_range
    call: 'ATR(cbind(high, low, close), 14)[, "tr"]'
    column: true_range
    agreement: identical
    tolerance: 1.0e-12
    note: >-
      Identical wherever both are defined. TTR leaves the first bar undefined,
      having no previous close; this catalogue uses the plain high-low range
      there and says so. That single bar is what the four entries below inherit.

  - factor: atr
    call: 'ATR(cbind(high, low, close), 14)[, "atr"]'
    column: atr
    agreement: converges
    initial_difference: 0.137
    converged_by: 267
    tolerance: 1.0e-9
    note: >-
      One extra observation in the seed, from the first bar's true range, and
      Wilder's recursion then forgets it geometrically. 0.137 apart at the first
      common bar, 0.0016 by bar 74, under 1e-9 from bar 267. Neither is wrong;
      the difference is whether a bar with no predecessor contributes its plain
      range or nothing.

  - factor: plus_di
    call: 'ADX(cbind(high, low, close), 14)[, "DIp"]'
    column: plus_di
    agreement: converges
    initial_difference: 0.73
    converged_by: 288
    tolerance: 1.0e-9
    note: The same seed, inherited through the true range in the denominator.

  - factor: minus_di
    call: 'ADX(cbind(high, low, close), 14)[, "DIn"]'
    column: minus_di
    agreement: converges
    initial_difference: 0.56
    converged_by: 289
    tolerance: 1.0e-9

  - factor: adx
    call: 'ADX(cbind(high, low, close), 14)[, "ADX"]'
    column: adx
    agreement: converges
    initial_difference: 0.84
    converged_by: 308
    tolerance: 1.0e-8
    note: >-
      Smoothed twice, so it inherits the difference and takes longest to lose
      it.

  # ── Not the same measurement ─────────────────────────────────────────────
  - factor: historical_volatility
    call: 'runSD(ROC(close, 1, type = "continuous"), 250) * sqrt(250) * 100'
    column: null
    agreement: not_compared
    note: >-
      TTR has no function that computes this catalogue's entry. `volatility(calc
      = "close")` is 0.26 points away on the reference series, because it uses
      the close-to-close estimator, which does not subtract the mean return.
      Written out with runSD it agrees to 1e-13, but that is R arithmetic rather
      than a TTR function, so there is nothing here to hold TTR to.
    trap:
      call: 'volatility(close, n = 250, calc = "close", N = 250) * 100'
      column: trap_volatility_close
      measured_difference: 0.25
      note: >-
        The nearest thing TTR offers, and a different estimator. Reaching for it
        as an equivalent is the mistake this entry exists to name.
