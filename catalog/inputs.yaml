# The data contract.
#
# Every factor in this catalogue declares which of these fields it consumes.
# Plugging in a data source means mapping that source's column names onto these
# names once; nothing else in the package needs to know where the numbers came
# from.
#
# Names are deliberately boring and spelled out. `ebit` beats `op_inc` because
# the person writing the mapping should not have to guess.

version: 1

price:
  description: >-
    One row per trading day per instrument, ordered by date, gaps allowed for
    holidays. Prices in the instrument's own currency.
  index: [symbol, date]
  fields:
    open:
      dtype: float
      required: false
      description: First traded price of the session.
    high:
      dtype: float
      required: false
      description: Highest traded price of the session.
    low:
      dtype: float
      required: false
      description: Lowest traded price of the session.
    close:
      dtype: float
      required: true
      description: >-
        Last traded price of the session, unadjusted. Used wherever a factor
        talks about "the price" without qualification.
    adjusted_close:
      dtype: float
      required: false
      description: >-
        Close adjusted for splits and dividends. Performance and growth factors
        use this when present and say so; oscillators use `close`, because an
        adjustment applied to the whole history silently rewrites every past
        oscillator reading.
    volume:
      dtype: float
      required: false
      description: Shares traded during the session.

fundamental:
  description: >-
    One row per instrument per reporting period, ordered by period end. The
    frame carries a `period` column stating which basis the row is on, so that
    annual, quarterly and trailing-twelve-month figures can live side by side
    without a naming convention doing the work.
  index: [symbol, period_end]
  fields:
    period:
      dtype: str
      required: true
      description: One of annual, quarterly, ttm.
    revenue: {dtype: float, required: false, description: Net sales or turnover for the period.}
    cost_of_revenue: {dtype: float, required: false, description: Cost of goods sold.}
    gross_profit: {dtype: float, required: false, description: Revenue less cost of revenue.}
    research_and_development: {dtype: float, required: false, description: R&D expense for the period.}
    ebit: {dtype: float, required: false, description: Earnings before interest and tax, i.e. operating income.}
    ebitda: {dtype: float, required: false, description: EBIT plus depreciation and amortisation.}
    depreciation_amortisation: {dtype: float, required: false, description: Depreciation and amortisation charged in the period.}
    interest_expense: {dtype: float, required: false, description: Interest paid on debt, as a positive number.}
    pretax_income: {dtype: float, required: false, description: Earnings before tax.}
    tax_expense: {dtype: float, required: false, description: Income tax charged for the period.}
    net_income: {dtype: float, required: false, description: Profit attributable to shareholders after tax and minorities.}
    eps_diluted: {dtype: float, required: false, description: Diluted earnings per share.}
    operating_cash_flow: {dtype: float, required: false, description: Cash generated by operations.}
    capital_expenditure: {dtype: float, required: false, description: Cash spent on property, plant and equipment, as a positive number.}
    free_cash_flow: {dtype: float, required: false, description: Operating cash flow less capital expenditure. Derived when absent.}
    dividends_paid: {dtype: float, required: false, description: Total cash dividends paid in the period, as a positive number.}
    dividend_per_share_paid: {dtype: float, required: false, description: Dividend actually paid per share over the period.}
    dividend_per_share_declared: {dtype: float, required: false, description: Dividend announced for the period, which may not yet be paid.}
    total_assets: {dtype: float, required: false, description: Balance sheet total.}
    current_assets: {dtype: float, required: false, description: Assets expected to convert to cash within a year.}
    inventory: {dtype: float, required: false, description: Inventories held at period end.}
    cash_and_equivalents: {dtype: float, required: false, description: Cash plus short-term liquid investments.}
    total_liabilities: {dtype: float, required: false, description: All liabilities, current and non-current.}
    current_liabilities: {dtype: float, required: false, description: Liabilities falling due within a year.}
    total_debt: {dtype: float, required: false, description: Interest-bearing debt, short and long term.}
    long_term_debt: {dtype: float, required: false, description: Interest-bearing debt falling due after a year.}
    total_equity: {dtype: float, required: false, description: Shareholders' equity including minorities.}
    common_equity: {dtype: float, required: false, description: Equity attributable to common shareholders.}
    shares_outstanding: {dtype: float, required: false, description: Shares in issue at period end.}
    invested_capital:
      dtype: float
      required: false
      description: >-
        Capital the business runs on. Derived as total equity plus total debt
        less cash when absent; the derivation is stated because every data
        vendor defines this one differently.

market:
  description: >-
    Per instrument per day, the figures that need a price and an account
    together. Derived by this package when absent from the source.
  index: [symbol, date]
  fields:
    market_cap: {dtype: float, required: false, description: Close times shares outstanding.}
    enterprise_value:
      dtype: float
      required: false
      description: Market cap plus total debt less cash and equivalents.

benchmark:
  description: >-
    A single price series used as the reference for relative factors. Same
    shape as `price`, without the symbol level.
  index: [date]
  fields:
    close: {dtype: float, required: true, description: Benchmark close.}

derived:
  description: >-
    Not data, but the output of other factors. The cross-sectional entries
    consume these: they take a value per instrument at one point in time and
    return a position within that set. A factor whose inputs are listed here
    cannot be computed from a single instrument's history, however long.
  index: [date, symbol]
  fields:
    factor_value:
      dtype: float
      required: true
      description: >-
        One factor's value for every instrument in the comparison set, at one
        date. A Series indexed by instrument, or a frame of dates by
        instruments.
    factor_values:
      dtype: float
      required: false
      description: >-
        Several factors' values, as a mapping from factor id to the above.
        Used by the composite entries.
