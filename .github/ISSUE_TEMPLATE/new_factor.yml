name: Propose a factor
description: Something the catalogue should hold and does not.
labels: ["catalogue"]
body:
  - type: markdown
    attributes:
      value: |
        An entry needs a definition that can be stated from published work. A
        rule that has to be invented does not go in under a borrowed name,
        because the absence of an entry is visible and a wrong one is not.

  - type: input
    id: name
    attributes:
      label: Name
      placeholder: Keltner Channel
    validations:
      required: true

  - type: textarea
    id: definition
    attributes:
      label: The definition
      description: >
        The formula, and the source it comes from. If several sources disagree,
        say so and say which one you would follow. That disagreement is usually
        the most useful part of the entry.
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - indicator, a number per bar from price and volume
        - signal, a boolean per bar from price and volume
        - fundamental, a number per reporting period from the accounts
        - composite, a rank or score across a universe
    validations:
      required: true

  - type: textarea
    id: inputs
    attributes:
      label: What it consumes
      description: >
        Fields from catalog/inputs.yaml, plus a benchmark or market series if it
        needs one. If it needs a field the vocabulary does not have, say which.
    validations:
      required: true

  - type: textarea
    id: disagreement
    attributes:
      label: Where implementations of this disagree
      description: >
        Smoothing constant, sample against population deviation, which bar the
        window starts on, what happens on a tie. Optional, and the part most
        worth writing.
    validations:
      required: false
