# Everything that runs on every push.
#
# ── WHY THIS FILE MATTERS ──────────────────────────────────────────────────
#
# A checker nobody runs is a file. This is the place where files become
# checkers, and `check_gates_wired.py` is the checker that keeps track of
# exactly that.
#
# ── WHAT BELONGS HERE ──────────────────────────────────────────────────────
#
# Every step names its checker by file name, so `check_gates_wired.py` can find
# it. Going through a package script is fine too, but then that script has to
# be called here by name.
#
# What does not belong here: a prose list of the gates. The binding list is
# this file, plus the repository's ruleset (`gh api repos/:owner/:repo/rulesets`).
# A list in a README is stale by the next merge.

name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python3 -m pip install --upgrade pip && python3 -m pip install -e ".[dev]"

      # First the checker over the checkers. If it fails, every step below says
      # less than it appears to say.
      - name: Every checker is actually called
        run: python3 scripts/check_gates_wired.py

      - name: The wiring checker's own test
        run: python3 scripts/check_gates_wired.test.py

      # ── THE PROJECT ITSELF ──────────────────────────────────────────────
      # Each gate named separately rather than hidden in one step, so a red
      # square says WHAT is red.

      - name: The catalogue and the code still describe the same thing
        run: python3 scripts/check_catalog_wired.py

      - name: Tests
        run: python3 -m pytest tests/ -W error::DeprecationWarning

      - name: Lint
        run: python3 -m ruff check src tests scripts

      - name: Formatting
        run: python3 -m ruff format --check src tests scripts

      - name: Types
        run: python3 -m mypy

      - name: The committed reference matches the catalogue
        run: python3 scripts/check_docs_current.py

      - name: The catalogue renders to SQLite
        run: python3 scripts/build_db.py --out /tmp/factorbase.sqlite3

  # pyproject declares a dependency floor. Nothing installs it: pip resolves to
  # the newest release every time, so the floor is a guess until something runs
  # against it. This job is that something. It found no difference on the day it
  # was added, which is the point - a floor that has never been exercised cannot
  # be said to hold.
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install at the declared minimum
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"
          python3 -m pip install "pandas==2.1.4" "numpy<2" "PyYAML==6.0"

      - name: Report what is actually installed
        run: python3 -c "import pandas, numpy, yaml; print(pandas.__version__, numpy.__version__, yaml.__version__)"

      - name: Tests at the floor
        run: python3 -m pytest tests/

      - name: The catalogue still loads at the floor
        run: python3 scripts/check_catalog_wired.py

  # The only check that compares this package to somebody else's arithmetic.
  # Its own job because it needs R, and a contributor without R should not be
  # blocked from running everything else. See catalog/mappings/ttr.yaml.
  ttr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # use-public-rspm points R at Posit's mirror, which serves Linux
      # binaries, so TTR's C code is not compiled on every run.
      #
      # Not setup-r-dependencies: that action solves the dependencies of the R
      # package in the working directory, and this repository is not one. It
      # fails with "Could not solve package dependencies" and no mention of the
      # missing DESCRIPTION.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install TTR
        run: Rscript -e 'install.packages("TTR")'

      - name: Install
        run: python3 -m pip install --upgrade pip && python3 -m pip install -e ".[dev]"

      - name: Report both versions
        run: Rscript -e 'cat("TTR", as.character(packageVersion("TTR")), "on", R.version.string, "\n")'

      - name: This catalogue against TTR
        run: python3 scripts/check_against_ttr.py
